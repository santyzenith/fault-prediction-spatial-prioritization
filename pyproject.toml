[project]
name = "prediccion-fallas-distribucion"
version = "1.0.0"
description = "Predicción de fallas en redes de distribución eléctrica con XGBoost, SHAP y calibración"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn>=0.14.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "shap>=0.49.1",
    "xgboost==2.1.4",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.5",
    "openpyxl>=3.1.5",
    "seaborn>=0.13.2",
]
